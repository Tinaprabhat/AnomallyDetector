[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly_detector_v2"
version = "2.0.0"
description = "Production-grade fraud detection with 4-model ensemble + statistical validation + multi-collection RAG + LLM-augmented explanations"
authors = [{name = "Tina Prabhat"}]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
markers = [
    "unit: unit tests (fast, no external deps)",
    "integration: integration tests (cross-module)",
    "slow: slow tests (training, large datasets)",
]
